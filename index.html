<!doctype html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="style.css">
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header"><a class="brand" href="#home" aria-label="와이펫 홈"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="6.5" cy="7" rx="2.1" ry="2.7"/><ellipse cx="12" cy="5" rx="2.1" ry="2.7"/><ellipse cx="17.5" cy="7" rx="2.1" ry="2.7"/><ellipse cx="3.8" cy="12" rx="1.8" ry="2.3"/><path d="M6 18c0-3 3-7 6-7s6 4 6 7c0 4-4 2-6 2s-6 2-6-2"/></svg>와이펫</a><span class="header-note">식사와 물 기록</span></header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <a href="#home" data-nav="home"><span data-icon="home"></span><span>홈</span></a>
      <a href="#report" data-nav="report"><span data-icon="chart"></span><span>리포트</span></a>
      <a href="#settings" data-nav="settings"><span data-icon="settings"></span><span>설정</span></a>

  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="scale-dialog" aria-labelledby="scale-title"><form id="scale-form"><h2 id="scale-title">저울 연결</h2><p class="muted">저울에서 무게를 읽을 수 있는 주소를 입력하세요.</p><label class="field">저울 데이터 주소<input name="endpoint" type="url" placeholder="https://device.example/api/weight" autocomplete="off"></label><p class="help">HTTPS 주소와 웹 접근 허용(CORS)이 필요합니다. <code>{"grams": 120}</code> 형식의 무게 데이터를 읽습니다.</p><p id="scale-error" class="form-error" role="alert"></p><div class="button-row"><button type="button" class="text-button" data-action="disconnect-scale">연결 해제</button><button type="button" class="secondary" data-action="close-dialog">취소</button><button type="submit" class="primary">연결 확인</button></div></form></dialog>
  <noscript>이 앱을 사용하려면 브라우저에서 자바스크립트를 허용해주세요.</noscript>
